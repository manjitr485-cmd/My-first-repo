<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Banking UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>💳 My Wallet</h1>

        <!-- Balance Section -->
        <div class="balance-card">
            <h2>Current Balance</h2>
            <p id="balance">₹0</p>
        </div>

        <!-- Deposit Section -->
        <div class="deposit-section">
            <button class="add-btn" data-amount="500">➕ Add ₹500</button>
            <button class="add-btn" data-amount="1000">➕ Add ₹1000</button>
            <button class="add-btn" data-amount="2000">➕ Add ₹2000</button>
        </div>

        <!-- Withdraw Section -->
        <div class="withdraw-section">
            <input type="number" id="withdrawAmount" placeholder="Enter amount">
            <button id="withdrawBtn">Withdraw</button>
        </div>

        <!-- Message -->
        <p id="message"></p>

        <!-- Transaction History (Bonus 🌟) -->
        <div class="history">
            <h3>Transaction History</h3>
            <ul id="transactionList"></ul>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
